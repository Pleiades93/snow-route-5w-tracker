<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Route 5W">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Route 5W — Snow Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; font-family: -apple-system, sans-serif; background: #14161c; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }   /* v5.48: no web tells (selection, callout, rubber-band) */   /* 100dvh (v5.43): track the VISIBLE viewport on iOS Safari - plain 100% measures the tallest state and hid the app's bottom edge behind the browser toolbar */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    /* v5.48: one surface system - every floating card shares colour, radius and shadow */
    --card-op: rgba(26,29,36,.97); --rad-card: 14px; --rad-btn: 11px; --shadow-card: 0 4px 20px rgba(0,0,0,.45); --shadow-float: 0 4px 14px rgba(0,0,0,.4); }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; background: #eceff2; }
  body.night #map { background: #14171d; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: #14161c; box-shadow: 0 1px 12px rgba(0,0,0,.35); color: #fff; padding: calc(10px + var(--sat)) calc(12px + var(--sar)) 12px calc(12px + var(--sal));   /* v5.44: solid header (was 93% opaque) - translucency over the map smeared the header text on iPhone */
  }
  #hud .row { display: flex; align-items: center; gap: 8px; }
  #hud .title { font-weight: 700; font-size: 17px; white-space: nowrap; }
  #hud .count { font-size: 14px; color: #cfe8d8; white-space: nowrap; }
  #hud .spacer { margin-left: auto; }
  #hud button {
    background: #2c7be5; color: #fff; border: none; border-radius: var(--rad-btn);
    padding: 9px 10px; font-size: 14px; font-weight: 600; min-height: 40px; white-space: nowrap;
  }
  #hud button.ghost { background: #444; }
  #hud button.armed { background: #d43a2f; }
  #hud button.undoing { background: #1e9e57; }
  #hud button.on { background: #2c7be5; }
  @media (max-width: 430px) { #hud .title { font-size: 16px; } #hud .count { font-size: 13px; } #hud button { font-size: 13px; padding: 9px 8px; } }
  #bar { height: 5px; background: #3a3f47; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: #2ecc71; transition: width .3s; }
  #warn {
    position: absolute; left: calc(10px + var(--sal)); top: calc(96px + var(--sat)); z-index: 1000;
    background: #b3261e; color: #fff; font-size: 12px; font-weight: 700;
    padding: 5px 9px; border-radius: 8px;
  }
  .hidden { display: none; }
  #info {
    position: absolute; top: calc(96px + var(--sat)); right: calc(10px + var(--sar)); z-index: 1000; width: min(196px, 52vw);
    background: var(--card-op); color: #fff; border-radius: var(--rad-card); padding: 8px;
    border-top: 3px solid var(--accent, transparent);
    box-shadow: var(--shadow-card);
    transition: opacity .15s ease, transform .15s ease; touch-action: manipulation;
  }
  #info.hidden { display: block; opacity: 0; pointer-events: none; transform: translateY(-8px); }
  #selName { font-size: 15px; font-weight: 700; line-height: 1.2; }
  #selStatus { font-size: 12px; margin: 3px 0 6px; color: #ddd; }
  #selStatus .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
  #selBtn {
    width: 100%; min-height: 48px; border: none; border-radius: var(--rad-btn);
    font-size: 14px; font-weight: 700; color: #fff; background: #1e9e57;
  }
  #selBtn.undo { background: #555; }
  #selBtn:disabled { background: #3a3f47; color: #999; }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100;
    background: #1c1f27; color: #fff; max-height: 62%; box-shadow: 0 -6px 24px rgba(0,0,0,.4);
    display: flex; flex-direction: column; border-top: 1px solid #444;
    border-radius: 18px 18px 0 0; overflow: hidden;   /* v5.44: rounded sheet corners (Andrew) - the sheet had none */
    transform: translateY(100%); transition: transform .25s, visibility 0s .25s;
    visibility: hidden;   /* v5.44: the sheet exists ONLY while List is open (Andrew) - hidden outright when closed, not just slid away, so no sliver can peek on iOS overscroll */
  }
  #sheet.open { transform: translateY(0); visibility: visible; transition: transform .25s; }
  #sheetHandle { width: 38px; height: 5px; border-radius: 3px; background: #4a5058; margin: 8px auto 2px; flex-shrink: 0; }   /* v5.48: classic sheet affordance (visual - Close is still the mechanism) */
  #sheetHead { display: flex; align-items: center; gap: 8px; padding: 8px calc(14px + var(--sar)) 6px calc(14px + var(--sal)); font-weight: 700; font-size: 15px; }
  #sheetHead button { background: #444; color: #fff; border: none; border-radius: var(--rad-btn); padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 40px; }
  #sheetHead #exportBtn { margin-left: auto; background: #2c7be5; }
  #filters { display: flex; gap: 8px; padding: 4px calc(14px + var(--sar)) 8px calc(14px + var(--sal)); }
  #filters button { flex: 1; background: #2c3440; color: #cbd2dc; border: none; border-radius: var(--rad-btn); padding: 9px 0; font-size: 14px; font-weight: 600; min-height: 40px; }
  #filters button.on { background: #fff; color: #14161c; }
  #streetList { overflow-y: auto; padding: 0 calc(14px + var(--sar)) calc(18px + var(--sab)) calc(14px + var(--sal)); }
  #streetList .empty { padding: 18px 4px; color: #9aa4b2; font-size: 15px; }
  .srow {
    display: flex; align-items: center; gap: 11px; padding: 12px 4px;
    border-bottom: 1px solid #333; font-size: 16px; cursor: pointer; min-height: 48px;
  }
  .srow .dot { width: 15px; height: 15px; border-radius: 50%; background: #e63a2e; flex-shrink: 0; }
  .srow.main .dot { background: #ffd24a; }
  .srow.done .dot { background: #2ecc71; }
  .srow.done .nm { color: #9fd3ae; }
  .srow .tm { margin-left: auto; font-size: 12px; color: #8fae99; white-space: nowrap; }
  /* v5.41: Flip + Night live in a dropdown again - the hamburger (three
     bars) sits bottom-right and the drop opens UPWARD from it (Andrew's
     call; the v5.40 standalone stack lasted one build). The wrap is raised
     a little so it clears the attribution strip / MapLibre logo in that
     corner. Buttons keep their ids, so applyFlip/applyNight are untouched. */
  #menuWrap { position: absolute; right: calc(10px + var(--sar)); bottom: calc(30px + var(--sab)); z-index: 1001; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #menuBtn {
    width: 46px; height: 46px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--card-op); box-shadow: var(--shadow-float);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  }
  #menuBtn i { display: block; width: 22px; height: 3px; border-radius: 2px; background: #fff; }
  #menuDrop { display: flex; flex-direction: column; gap: 8px; }
  #menuDrop.hidden { display: none; }
  #menuDrop button {
    min-height: 48px; min-width: 132px; padding: 12px 16px; border: none; border-radius: var(--rad-btn); cursor: pointer;
    background: var(--card-op); color: #fff; font-size: 15px; font-weight: 600; text-align: left;
    box-shadow: var(--shadow-float);
  }
  #menuDrop button.on { background: #6b4fd8; }
  /* Flip: the whole map (base tiles, streets, labels, GPS) rotates 180 degrees as one
     rigid piece, so geography and the split halves stay exact; the street-name labels
     are counter-rotated in applyFlip so they stay readable and street-aligned. */
  #map { transition: transform .45s ease-in-out; }
  body.flipped #map { transform: rotate(180deg); }
  body.flipped .leaflet-control-attribution { transform: rotate(180deg); }
  .refLabel span { display: inline-block; }
  #gpsBtn.on { background: #1a8cff; color: #fff; }
  #gpsBtn.paused { background: #f5a623; color: #fff; }
  button { touch-action: manipulation; transition: transform .08s ease; }
  button:active { transform: scale(.97); }   /* v5.48: native-feeling press feedback */
  #gpsBtn {
    position: absolute; left: calc(10px + var(--sal)); bottom: calc(16px + var(--sab)); z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: #fff; font-size: 23px; box-shadow: var(--shadow-float);
  }
  #homeBtn {
    position: absolute; left: calc(68px + var(--sal)); bottom: calc(16px + var(--sab)); z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: #fff; font-size: 21px; box-shadow: var(--shadow-float);
  }
  .leaflet-bottom.leaflet-left .leaflet-control-attribution {
    margin: 0 0 calc(4px + var(--sab)) calc(68px + var(--sal)); font-size: 9px; background: rgba(255,255,255,.7);
  }
  body.night .leaflet-control-attribution { background: rgba(20,23,29,.7); color: #9aa4b2; }
  .roadLabel { background: transparent; border: none; box-shadow: none; padding: 0; }
  .roadLabel::before { display: none; }
  .roadLabel span {
    display: inline-block; font-family: 'Noto Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: var(--labfs, 10px); font-weight: 400; letter-spacing: .01em; white-space: nowrap;
    color: #333; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 4px #fff;
  }
  body.night .roadLabel span { color: #d9d9d9; text-shadow: 0 0 3px rgba(0,0,0,.65), 0 0 3px rgba(0,0,0,.65), 0 0 4px rgba(0,0,0,.65), 0 0 4px rgba(0,0,0,.65); }
  body.labels-off .roadLabel { display: none; }
  .leaflet-overlay-pane path { filter: drop-shadow(0 1px 1px rgba(15,17,22,.35)); }
  .lbl-anchor { background: transparent; border: none; }
  .refLabel {
    background: rgba(70,74,80,.55); color: #e8e8e8; border: none;
    border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 600;
    white-space: nowrap; box-shadow: none;
  }
  .refLabel::before { display: none; }
  #toast {
    position: absolute; left: 50%; bottom: calc(156px + var(--sab)); transform: translateX(-50%) translateY(8px);
    z-index: 1200; background: var(--card-op); color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: 86vw; text-align: center; box-shadow: var(--shadow-card);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #xport { position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #xport.hidden { display: none; }
  #xport .card { background: #1b1f27; color: #fff; border-radius: 14px; padding: 14px; width: min(520px, 100%); }
  #xport .ttl { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  #xText { width: 100%; height: 42vh; background: #0f1217; color: #dfe6ee; border: 1px solid #333; border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: none; user-select: text; -webkit-user-select: text; }
  #xport .xrow { display: flex; gap: 8px; margin-top: 10px; }
  #xport .xrow button { flex: 1; min-height: 48px; border: none; border-radius: var(--rad-btn); background: #444; color: #fff; font-size: 15px; font-weight: 600; }
  #xport .xrow button.pri { background: #2c7be5; }
  #stats { font-size: 12px; color: #aab4c2; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

  #pacePanel .psec:first-child { margin-top: 0; }
  #pacePanel .pwide { width: 100%; margin: 4px 0 8px; }
  #pacePanel .phist { cursor: pointer; }
  #pacePanel .prow { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  #pacePanel .prow span:last-child { color: #fff; font-weight: 600; white-space: nowrap; }
  #pacePanel .faster { color: #7be495; font-weight: 700; }
  #pacePanel .slower { color: #ff9d8a; font-weight: 700; }
  #pacePanel .onpace { color: #ffd24a; font-weight: 700; }
  #pacePanel .phint { color: #8fa0b3; }

<body>
<div id="map"></div>
<div id="hud">
  <div class="row">
    <div class="title">Route 5W</div>
    <div class="count" id="count"></div>
    <div class="spacer"></div>
    <button class="ghost" id="resetBtn">Reset</button>
    <button class="ghost" id="paceBtn">Pace &#9662;</button>
    <button id="listBtn">List</button>
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="stats" class="hidden"></div>
  <div id="pacePanel" class="hidden"></div>
</div>
<div id="warn" class="hidden">&#9888; Not saving</div>
<div id="info" class="hidden">
  <div id="selName">No street selected</div>
  <div id="selStatus">Tap a street on the map</div>
  <button id="selBtn" disabled>Mark completed</button>
</div>
<button id="gpsBtn" title="My location">&#128205;</button>
<button id="homeBtn" title="Back to route">&#127968;</button>
<div id="menuWrap">
  <div id="menuDrop" class="hidden">
    <button id="flipBtn">Flip</button>
    <button id="nightBtn">Night</button>
  </div>
  <button id="menuBtn" aria-label="Map options"><i></i><i></i><i></i></button>
</div>
<div id="spd" class="hidden"></div>
<div id="suggest" class="hidden"><span id="sugText"></span><button id="sugYes">Show street</button><button id="sugNo">Not yet</button></div>
<div id="stale" class="hidden"><span id="staleText"></span><button id="staleYes">Archive &amp; start new</button><button id="staleNo">Keep</button></div>
<div id="toast"></div>
<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="sheetHead">Streets<button id="exportBtn">Export</button><button id="sheetClose">Close</button></div>
  <div id="filters"><button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button></div>
  <div id="streetList"></div>
</div>
<div id="xport" class="hidden">
  <div class="card">
    <div class="ttl" id="xTitle">Snow log</div>
    <textarea id="xText" readonly></textarea>
    <div class="xrow"><button id="xShare" class="pri">Share</button><button id="xCopy">Copy</button><button id="xClose">Close</button></div>
    <div class="xrow"><button id="xSum">Summary</button><button id="xGpx">GPX trail</button><button id="xClr">Clear trail</button></div>
    <div class="xrow"><button id="xBak">Backup (JSON)</button><button id="xRes">Restore</button><button id="xImp" class="pri" style="display:none">Import backup</button></div>
  </div>
</div>

  const segs = []; let seg = [];

    if (seg.length) { const q = seg[seg.length - 1]; if (p[2] - q[2] > 300 || dist(q, p) > 1000) { if (seg.length > 1) segs.push(seg); seg = []; } }

function thinOnce(pts, stepSec) {

  for (const p of pts) { if (p[2] - last >= stepSec) { out.push(p); last = p[2]; } }

}

  trailDrawnKey = key;

// Full-state backup: every storage key in one JSON blob \u2014 the way out if the phone, the
// app, or the host ever loses the local data. Restore writes the keys back and reloads.
function backupKeys() { return [LS_KEY, LS_TIMES_KEY, LS_HIST_KEY, LS_NIGHT_KEY, LS_NOTES_KEY, LS_VIA_KEY, LS_TRAIL_KEY, LS_COV_KEY, LS_START_KEY, LS_SIDES_KEY, LS_FLIP_KEY]; }
function buildBackup() {
  const data = {};
  backupKeys().forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });

function doRestore() {

  if (!parsed || parsed.app !== 'snow5w-backup' || !parsed.data || typeof parsed.data !== 'object' || Array.isArray(parsed.data)) { showToast('That is not a Route 5W backup'); return; }
  if (parsed.v !== 1) { showToast('Unsupported backup version (' + String(parsed.v) + ') \u2014 nothing was changed'); return; }

  // keys must parse to the right shape; the plain-string keys (start / night / flip)
  // only need to be strings. One bad value rejects the whole backup, state untouched.
  const JSON_SHAPE = { [LS_KEY]: 'arr', [LS_TIMES_KEY]: 'obj', [LS_HIST_KEY]: 'arr', [LS_NOTES_KEY]: 'obj', [LS_VIA_KEY]: 'obj', [LS_TRAIL_KEY]: 'arr', [LS_COV_KEY]: 'obj', [LS_SIDES_KEY]: 'obj' };
  const entries = [];
  for (const k of backupKeys()) {
    let v = parsed.data[k];
    if (v === undefined) continue;   // Missing-key policy (README): a key absent from the backup leaves the current value untouched - restore replaces what the backup contains, it does not clear what it does not mention.
    if (typeof v !== 'string') { showToast('Backup has a bad value for ' + k + ' \u2014 nothing was changed'); return; }
    const shape = JSON_SHAPE[k];
    if (shape) {
      let pv; try { pv = JSON.parse(v); } catch (e) { showToast('Backup value for ' + k + ' is not valid JSON \u2014 nothing was changed'); return; }
      if (k === LS_KEY && pv && typeof pv === 'object' && !Array.isArray(pv)) {
        // ISSUE-05 (audit 2): legacy format - the completion set was once an
        // object map (street -> time). Migrate to the modern array, same rule
        // the loader applies, so legitimate old backups still restore.
        v = JSON.stringify(Object.keys(pv).filter(nm => pv[nm] && ROADS[nm]));
      } else if (shape === 'arr' ? !Array.isArray(pv) : !(pv && typeof pv === 'object' && !Array.isArray(pv))) { showToast('Backup value for ' + k + ' has the wrong shape \u2014 nothing was changed'); return; }
    }

  // Any failure rolls the snapshot back in: a restore is all-or-nothing, never a
  // mixed state (the old code wrote key-by-key and reloaded regardless).
  const snap = {};

  // ISSUE-02 (audits 2 + 3): rollback is VERIFIED by reading every key back.
  // The old version assumed the rollback worked and said so; on a double
  // failure the message lied. Now the report matches what actually happened.
  const rollback = () => {
    let okBack = true;
    backupKeys().forEach(k => {
      try { if (snap[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, snap[k]); } catch (e) {}
      if (localStorage.getItem(k) !== snap[k]) okBack = false;
    });
    return okBack;
  };
  for (const pair of entries) {
    const k = pair[0], v = pair[1];
    if (!lsSet(k, v) || localStorage.getItem(k) !== v) {
      if (rollback()) showToast('Restore failed while writing ' + k + ' \u2014 your current data was put back, nothing was changed');
      else showToast('Restore failed while writing ' + k + ' \u2014 and your previous data could NOT be fully put back. Restore from a known-good backup');
      return;
    }
  }
  restoring = true; trailDirty = false; auxDirty = false;   // SEC-4: the reload below fires pagehide, whose flush would otherwise write the OLD in-memory trail/coverage over the data just restored
  showToast('Backup restored \u2014 reloading');
  setTimeout(() => location.reload(), 600);
}

let resetArmed = false, resetArmTimer = null, resetUndo = null, resetUndoTimer = null;

  let snap = null;

    const ts = [...doneSet].map(n => Date.parse(doneTimes[n])).filter(t => !isNaN(t)).sort((a, b) => a - b);
    snap = { at: new Date().toISOString(), items: {}, via: Object.assign({}, doneVia), notes: JSON.parse(JSON.stringify(notes)),

    doneSet.forEach(n => { snap.items[n] = doneTimes[n] || null; });
    const sMs = Date.parse(snap.startedAt);
    if (!isNaN(sMs)) { const pp = thinPath(trail.filter(p => p[2] * 1000 >= sMs - 60000)); if (pp.length > 1) snap.path = pp; }
  }

  // one-street reset must not evict a real clean (the pace baseline) from the 10 slots.
  const archiving = !!(snap && doneSet.size >= 3);
  if (archiving) {
    // SAFE ARCHIVE: write the new history and verify it landed before clearing anything.
    // If the write fails (storage quota — archived GPS paths are the big field), retry
    // without the path; if it still fails, abort with the live run completely untouched.
    const newHist = trimHistory([...history, snap]);
    if (!lsSet(LS_HIST_KEY, JSON.stringify(newHist))) {
      delete snap.path;
      if (!lsSet(LS_HIST_KEY, JSON.stringify(newHist))) {

    resetBtn.classList.remove('armed');
    resetBtn.classList.add('undoing');

  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#14161c'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#ffd24a'; x.fillRect(24, 128, 132, 10);
    x.fillStyle = '#ffffff'; x.font = 'bold 84px -apple-system, Helvetica, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('5W', 90, 74);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch (e) {}
})();
// (v5.31: the old service-worker registration is gone \u2014 the host serves this single file,
// so sw.js never existed here and the registration only ever failed silently.)

// ===== INIT =====

// ===== Flip (rotate the map 180 degrees) =====
// For starting the route from the Village Green (north) end: press Flip and the whole
// map turns upside down - Village Green goes to the bottom, you drive "up" the screen,
// nothing about the streets changes in the data; the map element itself rotates (body.flipped),
// the labels are counter-rotated so they stay readable, and the state persists across
// reloads. While flipped, Leaflet's own drag/pinch would move the map the wrong way
// (its maths does not know the element is rotated), so dragging is replaced with a
// small pointer handler: panBy shifts the view by the finger's own delta, which -
// because the view itself is what moves - makes the map content follow the finger
// exactly as it does unflipped. Pinch zooms around the centre.
// Flipped mode mirrors taps (tapLatLng) so the street under the finger is the
// street selected.

const LS_FLIP_KEY = 'snow5w.v5.flip';
let flipped = false;
try { flipped = localStorage.getItem(LS_FLIP_KEY) === '1'; } catch (e) {}
const flipBtn = $('flipBtn');
function applyFlip() {
  document.body.classList.toggle('flipped', flipped);
  document.querySelectorAll('.roadLabel span').forEach(s => {
    const base = parseFloat(s.getAttribute('data-rot') || '0') || 0;
    s.style.transform = 'rotate(' + (base + (flipped ? 180 : 0)).toFixed(1) + 'deg)';
  });
  document.querySelectorAll('.refLabel span').forEach(s => {
    s.style.transform = flipped ? 'rotate(180deg)' : '';
  });
  flipBtn.classList.toggle('on', flipped);
  flipBtn.textContent = flipped ? 'Flip: ON' : 'Flip';
  refreshAll();
  if (flipped) {
    map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
    map.scrollWheelZoom.disable(); if (map.keyboard) map.keyboard.disable();
  } else {
    map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable();
    map.scrollWheelZoom.enable(); if (map.keyboard) map.keyboard.enable();
  }
}
flipBtn.addEventListener('click', () => {
  if (tapGuard('flip')) return;
  flipped = !flipped;
  try { localStorage.setItem(LS_FLIP_KEY, flipped ? '1' : ''); } catch (e) {}
  applyFlip();
});
// v5.41 dropdown wiring (menu back, bottom-right): the hamburger toggles the
// drop; choosing an item runs it (its own handler above) and closes the drop;
// a tap on the map closes it.
const menuBtn = $('menuBtn'), menuDrop = $('menuDrop');
function closeMenu() { menuDrop.classList.add('hidden'); }
menuBtn.addEventListener('click', () => { if (tapGuard('menu')) return; menuDrop.classList.toggle('hidden'); });
flipBtn.addEventListener('click', closeMenu);
nightBtn.addEventListener('click', closeMenu);
map.on('click', closeMenu);
(function () {
  const el = map.getContainer(), pts = new Map();
  let pinchBase = 0, panMoved = 0;
  el.addEventListener('pointerdown', e => { if (pts.size === 0) panMoved = 0; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinchBase = 0; });
  el.addEventListener('pointermove', e => {
    if (!flipped || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      panMoved += Math.abs(dx) + Math.abs(dy);
      if (panMoved > 4) pauseFollow();   // a flipped pan is a deliberate look away \u2014 the next GPS fix must not yank it back
      map.panBy(L.point(dx, dy), { animate: false });
    } else if (pts.size === 2) {
      panMoved += 10;
      const a = [...pts.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (!pinchBase) { pinchBase = d; return; }
      if (d > pinchBase * 1.3) { map.zoomIn(); pinchBase = d; }
      else if (d < pinchBase / 1.3) { map.zoomOut(); pinchBase = d; }
    }
  });
  const drop = e => { pts.delete(e.pointerId); pinchBase = 0; if (panMoved > 8) swallowClickUntil = Date.now() + 100; };
  el.addEventListener('pointerup', drop);
  el.addEventListener('pointercancel', drop);
})();

// Service worker (v5.34): sw.js exists only beside the page on folder hosts
// (the deployable bundle). Where it isn't served — the Muse link — registration
// 404s into the catch and the page behaves exactly as before; where it is, the
// worker gives the tracker a true offline open.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// ===== OFFLINE MAP PREP (v5.42) =====
// One time only, a few seconds after the first online load, the route area's
// basemap tiles (day + night, zooms 13-15, 46 tiles for this route) are quietly requested
// so the service worker caches them (it caches every Esri tile it serves) -
// a later cold start with no signal then still shows the map under the
// route. Plain Image() requests are all it takes; the prep flag in storage
// records when it ran and how many tiles landed.
const PREP_KEY = 'snow5w.prep.v1';
function tileXY(lat, lng, z) {
  const n = Math.pow(2, z);
  const x = Math.floor((lng + 180) / 360 * n);
  const la = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n);
  return [x, y];
}
function prepOfflineMaps() {
  try { if (localStorage.getItem(PREP_KEY) || !navigator.onLine) return; } catch (e) { return; }
  let minLa = 90, maxLa = -90, minLn = 180, maxLn = -180;
  names.forEach(nm => streets[nm].segs.forEach(seg => seg.forEach(p => {
    if (p[0] < minLa) minLa = p[0]; if (p[0] > maxLa) maxLa = p[0];
    if (p[1] < minLn) minLn = p[1]; if (p[1] > maxLn) maxLn = p[1];
  })));
  const pad = 0.004;
  minLa -= pad; minLn -= pad; maxLa += pad; maxLn += pad;
  const urls = [];
  [13, 14, 15].forEach(z => {
    const a = tileXY(maxLa, minLn, z), b = tileXY(minLa, maxLn, z);
    for (let x = a[0]; x <= b[0]; x++) for (let y = a[1]; y <= b[1]; y++) {
      urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/' + z + '/' + y + '/' + x);
      urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/' + z + '/' + y + '/' + x);
    }
  });
  if (urls.length > 1200) return;   // sanity bound - this route needs 46
  let i = 0, okCount = 0, active = 0;
  const step = () => {
    if (i >= urls.length && active === 0) {
      if (okCount > 0) { try { localStorage.setItem(PREP_KEY, JSON.stringify({ at: new Date().toISOString(), count: okCount })); } catch (e) {} }   // SEC-6a: a fully failed prep used to mark itself done and never retry
      if (okCount) showToast('Offline map saved for the route area (' + okCount + ' tiles)');
      return;
    }
    while (active < 6 && i < urls.length) {
      const u = urls[i++]; active++;
      const im = new Image();
      im.onload = () => { okCount++; active--; step(); };
      im.onerror = () => { active--; step(); };
      im.src = u;
    }
  };
  step();
  if (BASEMAP_MODE === 'vector') [GL_STYLES.day, GL_STYLES.night].forEach(u => fetch(u).catch(() => {}));   // warm the style files too; the worker caches them
}
setTimeout(prepOfflineMaps, 4000);

// v5.43: on iOS the visible viewport changes as Safari's chrome shows and
// hides; keep the map sized to what is actually visible.
if (window.visualViewport) {
  let vvT = 0;
  window.visualViewport.addEventListener('resize', () => {
    clearTimeout(vvT);
    vvT = setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 150);
  });
}

refreshAll(); applyNight(); applyFlip(); checkStale();
</script>
</body>
</html>
