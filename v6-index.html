<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Route 5W">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<title>Route 5W — Snow Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #14161c; }
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; background: #eceff2; }
  body.night #map { background: #14171d; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(20,22,28,.93); color: #fff; padding: calc(10px + var(--sat)) 12px 12px;
  }
  #hud .row { display: flex; align-items: center; gap: 10px; }
  #hud .title { font-weight: 700; font-size: 16px; white-space: nowrap; }
  #hud .count { font-size: 13px; color: #cfe8d8; white-space: nowrap; }
  #hud .spacer { margin-left: auto; }
  #hud button {
    background: #2c7be5; color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; font-weight: 600; min-height: 40px;
  }
  #hud button.ghost { background: #444; }
  #hud button.armed { background: #d43a2f; }
  #hud button.undoing { background: #1e9e57; }
  #bar { height: 5px; background: #3a3f47; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: #2ecc71; transition: width .3s; }
  #warn {
    position: absolute; left: 10px; top: calc(102px + var(--sat)); z-index: 1000;
    background: #b3261e; color: #fff; font-size: 12px; font-weight: 700;
    padding: 5px 9px; border-radius: 8px;
  }
  .hidden { display: none; }
  #info {
    position: absolute; top: calc(96px + var(--sat)); right: 10px; z-index: 1000; width: min(252px, 64vw);
    background: rgba(20,22,28,.94); color: #fff; border-radius: 12px; padding: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    transition: opacity .15s ease, transform .15s ease; touch-action: manipulation;
  }
  #info.hidden { display: block; opacity: 0; pointer-events: none; transform: translateY(-8px); }
  #selName { font-size: 20px; font-weight: 700; line-height: 1.2; }
  #selStatus { font-size: 14px; margin: 5px 0 10px; color: #ddd; }
  #selStatus .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
  #selBtn {
    width: 100%; min-height: 52px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700; color: #fff; background: #1e9e57;
  }
  #selBtn.undo { background: #555; }
  #selBtn:disabled { background: #3a3f47; color: #999; }
  #nextBtn {
    width: 100%; min-height: 44px; margin-top: 8px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: #fff; background: #2c3440;
  }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100;
    background: rgba(20,22,28,.97); color: #fff; max-height: 62%;
    display: flex; flex-direction: column; border-top: 1px solid #444;
    transform: translateY(100%); transition: transform .25s;
  }
  #sheet.open { transform: translateY(0); }
  #sheetHead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; font-weight: 700; font-size: 15px; }
  #sheetHead button { background: #444; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 40px; }
  #sheetHead #exportBtn { margin-left: auto; background: #2c7be5; }
  #filters { display: flex; gap: 8px; padding: 4px 14px 8px; }
  #filters button { flex: 1; background: #2c3440; color: #cbd2dc; border: none; border-radius: 8px; padding: 9px 0; font-size: 14px; font-weight: 600; min-height: 40px; }
  #filters button.on { background: #fff; color: #14161c; }
  #streetList { overflow-y: auto; padding: 0 14px calc(18px + var(--sab)); }
  #streetList .empty { padding: 18px 4px; color: #9aa4b2; font-size: 15px; }
  .srow {
    display: flex; align-items: center; gap: 11px; padding: 12px 4px;
    border-bottom: 1px solid #333; font-size: 16px; cursor: pointer; min-height: 48px;
  }
  .srow .dot { width: 15px; height: 15px; border-radius: 50%; background: #e63a2e; flex-shrink: 0; }
  .srow.main .dot { background: #ffd24a; }
  .srow.done .dot { background: #2ecc71; }
  .srow.done .nm { color: #9fd3ae; }
  .srow .tm { margin-left: auto; font-size: 12px; color: #8fae99; white-space: nowrap; }
  #offBtn, #nightBtn, #satBtn {
    position: absolute; right: 10px; z-index: 1000;
    min-height: 48px; padding: 12px 16px; border: none; border-radius: 10px;
    background: #444; color: #fff; font-size: 15px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  #offBtn { bottom: calc(16px + var(--sab)); }
  #satBtn { bottom: calc(74px + var(--sab)); }
  #nightBtn { bottom: calc(132px + var(--sab)); }
  #offBtn.on { background: #1a8cff; }
  #nightBtn.on { background: #6b4fd8; }
  #satBtn.on { background: #2c7be5; }
  #gpsBtn.on { background: #1a8cff; color: #fff; }
  #gpsBtn.paused { background: #f5a623; color: #fff; }
  button { touch-action: manipulation; }
  #gpsBtn {
    position: absolute; left: 10px; bottom: calc(16px + var(--sab)); z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: #fff; font-size: 23px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .maplibregl-ctrl-attrib { margin: 0 0 calc(4px + var(--sab)) 68px !important; font-size: 9px; background: rgba(255,255,255,.7) !important; color: #555; padding: 1px 5px; border-radius: 4px; }
  body.night .maplibregl-ctrl-attrib { background: rgba(20,23,29,.7) !important; color: #9aa4b2; }
  .maplibregl-ctrl-attrib a { color: inherit; }
  .maplibregl-canvas { outline: none; }
  .refLabel {
    background: rgba(70,74,80,.55); color: #e8e8e8; border: none;
    border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 600;
    white-space: nowrap; box-shadow: none;
  }
  .refLabel::before { display: none; }
  .roadLabel {
    background: rgba(255,255,255,.55); color: #59616d; border: none;
    border-radius: 4px; padding: 0 4px; font-size: 9px; font-weight: 600;
    white-space: nowrap; box-shadow: none; pointer-events: none;
  }
  .roadLabel::before { display: none; }
  body.night .roadLabel { background: rgba(20,23,29,.6); color: #9aa4b2; }
  #toast {
    position: absolute; left: 50%; bottom: calc(272px + var(--sab)); transform: translateX(-50%) translateY(8px);
    z-index: 1200; background: rgba(20,22,28,.95); color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: 86vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #xport { position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #xport.hidden { display: none; }
  #xport .card { background: #1b1f27; color: #fff; border-radius: 14px; padding: 14px; width: min(520px, 100%); }
  #xport .ttl { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  #xText { width: 100%; height: 42vh; background: #0f1217; color: #dfe6ee; border: 1px solid #333; border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: none; }
  #xport .xrow { display: flex; gap: 8px; margin-top: 10px; }
  #xport .xrow button { flex: 1; min-height: 48px; border: none; border-radius: 10px; background: #444; color: #fff; font-size: 15px; font-weight: 600; }
  #xport .xrow button.pri { background: #2c7be5; }
  #stats { font-size: 12px; color: #aab4c2; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #spd { position: absolute; left: 10px; bottom: calc(74px + var(--sab)); z-index: 1000; background: rgba(20,22,28,.9); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 9px; border-radius: 8px; }
  #suggest { position: absolute; left: 10px; right: 10px; bottom: calc(190px + var(--sab)); z-index: 1000; background: rgba(20,22,28,.96); color: #fff; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #suggest.hidden { display: none; }
  #suggest span { flex: 1; font-weight: 700; font-size: 15px; }
  #suggest button { min-height: 48px; border: none; border-radius: 10px; padding: 0 14px; font-size: 15px; font-weight: 700; color: #fff; background: #1e9e57; }
  #suggest #sugNo { background: #444; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .chips button { min-height: 40px; border: none; border-radius: 8px; background: #2c3440; color: #cbd2dc; font-size: 13px; font-weight: 600; }
  .chips button.on { background: #c2410c; color: #fff; }
  #navBtn { width: 100%; min-height: 44px; margin-top: 8px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: #fff; background: #2c3440; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="row">
    <div class="title">Route 5W</div>
    <div class="count" id="count"></div>
    <div class="spacer"></div>
    <button class="ghost" id="resetBtn">Reset</button>
    <button id="listBtn">List</button>
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="stats" class="hidden"></div>
</div>
<div id="warn" class="hidden">&#9888; Not saving</div>
<div id="info" class="hidden">
  <div id="selName">No street selected</div>
  <div id="selStatus">Tap a street on the map</div>
  <button id="selBtn" disabled>Mark completed</button>
  <button id="nextBtn" style="display:none">Next pending street &rsaquo;</button>
  <div class="chips" id="flagChips" style="display:none"><button data-k="car">Car blocking</button><button data-k="hazard">Hazard</button><button data-k="missed">Missed spot</button><button data-k="salt">Needs salt</button></div>
  <button id="navBtn" style="display:none">Navigate to start</button>
</div>
<button id="gpsBtn" title="My location">&#128205;</button>
<div id="spd" class="hidden"></div>
<div id="suggest" class="hidden"><span id="sugText"></span><button id="sugYes">Mark done</button><button id="sugNo">Not yet</button></div>
<button id="nightBtn">Night</button>
<button id="satBtn">Satellite</button>
<button id="offBtn">Offline map</button>
<div id="toast"></div>
<div id="sheet">
  <div id="sheetHead">Streets<button id="exportBtn">Export</button><button id="sheetClose">Close</button></div>
  <div id="filters"><button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button></div>
  <div id="streetList"></div>
</div>
<div id="xport" class="hidden">
  <div class="card">
    <div class="ttl" id="xTitle">Snow log</div>
    <textarea id="xText" readonly></textarea>
    <div class="xrow"><button id="xShare" class="pri">Share</button><button id="xCopy">Copy</button><button id="xClose">Close</button></div>
    <div class="xrow"><button id="xSum">Summary</button><button id="xGpx">GPX trail</button><button id="xClr">Clear trail</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

// ===== TIME FORMATS =====
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2 = n => String(n).padStart(2, '0');
function fmtClock(d) {
  let h = d.getHours();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + p2(d.getMinutes()) + ' ' + ap;
}
// today -> "7:42 PM"; any other day -> "Oct 23, 7:42 PM" (a clock time alone is ambiguous across storms/midnight)
function fmtWhen(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const n = new Date();
  const same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  return same ? fmtClock(d) : MON[d.getMonth()] + ' ' + d.getDate() + ', ' + fmtClock(d);
}
function fmtStamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

function fmtDur(ms) { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? h + ' h ' + p2(m % 60) + ' m' : m + ' m'; }
function fmtAgo(iso) {
  const t = Date.parse(iso); if (isNaN(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' h ' + (m % 60) + ' m ago';
}

// ===== MAP (MapLibre GL — vector basemap: OpenFreeMap positron, restyled at runtime) =====
// Bounds are plain objects (no map-library types): {west, south, east, north} + helpers.
function makeBounds(w, s, e, n) {
  return {
    west: w, south: s, east: e, north: n,
    pad(f) { const dx = (e - w) * f, dy = (n - s) * f; return makeBounds(w - dx, s - dy, e + dx, n + dy); },
    contains(p) { return p[0] >= s && p[0] <= n && p[1] >= w && p[1] <= e; },
    getCenter() { return { lat: (s + n) / 2, lng: (w + e) / 2 }; }
  };
}
const OFFLINE_STYLES = {
  day:   [{ color: '#c9ced6', weight: 2 }, { color: '#aeb6c2', weight: 3 }, { color: '#98a2b3', weight: 4 }],
  night: [{ color: '#2f3642', weight: 2 }, { color: '#434c5a', weight: 3 }, { color: '#5b6677', weight: 4 }]
};
const toLL = p => [p[1], p[0]];   // stored [lat, lng] -> map [lng, lat]

// Streets: geometry + bounds only; rendering lives in one GeoJSON source restyled from app state.
const streets = {};
const allBounds = [];
names.forEach(name => {
  const segs = ROADS[name].map(pl => pl.map(p => [p[0], p[1]]));
  let w = 180, s = 90, e = -180, n = -90;
  segs.forEach(sg => sg.forEach(ll => {
    if (ll[1] < w) w = ll[1]; if (ll[1] > e) e = ll[1];
    if (ll[0] < s) s = ll[0]; if (ll[0] > n) n = ll[0];
    allBounds.push(ll);
  }));
  streets[name] = { bounds: makeBounds(w, s, e, n), segs };
});
Object.values(REFERENCE).forEach(polys => polys.forEach(pl => pl.forEach(p => allBounds.push([p[0], p[1]]))));

// ===== MAP CAP — route extent + ~400 m =====
let _bw = 180, _bs = 90, _be = -180, _bn = -90;
allBounds.forEach(ll => {
  if (ll[1] < _bw) _bw = ll[1]; if (ll[1] > _be) _be = ll[1];
  if (ll[0] < _bs) _bs = ll[0]; if (ll[0] > _bn) _bn = ll[0];
});
const _rcLat = (_bs + _bn) / 2;
const _dLat = 400 / 111320, _dLng = 400 / (111320 * Math.cos(_rcLat * Math.PI / 180));
const allowedBounds = makeBounds(_bw - _dLng, _bs - _dLat, _be + _dLng, _bn + _dLat);
const AB = [[allowedBounds.west, allowedBounds.south], [allowedBounds.east, allowedBounds.north]];

// Basemap visibility: vector style | satellite raster | embedded offline network.
function applyBasemap() {

  baseLayerIds.forEach(id => { try { map.setLayoutProperty(id, 'visibility', mode === 'vec' ? 'visible' : 'none'); } catch (e) {} });
  try {
    map.setLayoutProperty('esri', 'visibility', mode === 'sat' ? 'visible' : 'none');
    map.setLayoutProperty('offnet-line', 'visibility', mode === 'off' ? 'visible' : 'none');
    map.setLayoutProperty('offlabels', 'visibility', mode === 'off' ? 'visible' : 'none');

// Night: positron restyled dark at runtime (originals captured at load and restored for day).
const NIGHT_PAINT = {
  background: ['background-color', '#14171d'], water: ['fill-color', '#16222e'],
  park: ['fill-color', '#1a2129'], landuse_residential: ['fill-color', '#171c23'],
  landcover_wood: ['fill-color', '#1a2420'], building: ['fill-color', '#20262f'],
  waterway: ['line-color', '#24384a']
};
function restyleBasemap() {
  if (!mapReady || !basePaintOrig) return;
  baseLayerIds.forEach(id => {
    const L = map.getLayer(id); if (!L) return;
    const orig = basePaintOrig[id] || {};
    ['background-color', 'fill-color', 'line-color', 'text-color', 'text-halo-color', 'fill-outline-color'].forEach(prop => {
      try { map.setPaintProperty(id, prop, orig[prop] === undefined ? null : orig[prop]); } catch (e) {}
    });
    if (!nightOn) return;
    try {
      if (NIGHT_PAINT[id]) map.setPaintProperty(id, NIGHT_PAINT[id][0], NIGHT_PAINT[id][1]);
      else if (L.type === 'symbol') { map.setPaintProperty(id, 'text-color', '#9aa4b2'); map.setPaintProperty(id, 'text-halo-color', '#14171d'); }
      else if (L.type === 'line') map.setPaintProperty(id, 'line-color', '#39424f');
      else if (L.type === 'fill') map.setPaintProperty(id, 'fill-color', '#1b212a');
    } catch (e) {}
  });
}

// Tap resolution: the tap selects the NEAREST street within ~30 px, so intersections
// never favour whichever street happens to be drawn on top.
function pointToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
  let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function nearestStreet(ll) {
  const pt = map.project([ll.lng, ll.lat]);
  let best = null, bd = Infinity;
  names.forEach(n => streets[n].segs.forEach(seg => {
    for (let i = 0; i < seg.length - 1; i++) {
      const d = pointToSeg(pt, map.project(toLL(seg[i])), map.project(toLL(seg[i + 1])));
      if (d < bd) { bd = d; best = n; }
    }
  }));
  return bd <= 30 ? best : null;
}

// "Next pending street": the closest street still to do — measured from the live GPS fix when it is
// fresh, otherwise from the street just handled. While following, it selects only (you are already
// there); otherwise it also flies the map to it.
function nextPending() {
  let ref = null;
  if (watchId !== null && lastPos && Date.now() - lastFixAt < 60000) ref = lastPos;
  else if (selected) { const c = streets[selected].bounds.getCenter(); ref = [c.lat, c.lng]; }
  if (!ref) return;
  const k = Math.cos(ref[0] * Math.PI / 180);
  let best = null, bd = Infinity;
  names.forEach(n => {
    if (doneSet.has(n) || n === selected) return;
    streets[n].segs.forEach(seg => seg.forEach(p => {
      const dx = (p[1] - ref[1]) * k, dy = p[0] - ref[0], d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = n; }
    }));
  });
  if (!best) { showToast('No other streets left'); return; }
  select(best);
  if (follow) showToast('Next: ' + best);
  else map.fitBounds([[streets[best].bounds.west, streets[best].bounds.south], [streets[best].bounds.east, streets[best].bounds.north]], { padding: 45, maxZoom: 17 });
}

});

function flagText(n) { return (notes[n] || []).map(f => (FLAGS[f.k] || f.k) + (f.at ? ' ' + fmtClock(new Date(f.at)) : '')).join('; '); }
function buildReport() {
  const byTime = m => (a, b) => String(m[a] || '').localeCompare(String(m[b] || ''));
  const ts = [...doneSet].map(n => Date.parse(doneTimes[n])).filter(t => !isNaN(t)).sort((a, b) => a - b);
  const L2 = ['Route 5W \u2014 snow log', 'Exported: ' + fmtStamp(new Date().toISOString()), 'Completed: ' + doneSet.size + ' of ' + TOTAL];
  if (ts.length) {
    L2.push('Started: ' + fmtStamp(new Date(ts[0]).toISOString()) + '   Last: ' + fmtStamp(new Date(ts[ts.length - 1]).toISOString()) +
            '   Duration: ' + fmtDur(ts[ts.length - 1] - ts[0]));
    if (trail.length > 1) L2.push('GPS distance since start: ' + trailKm(ts[0]).toFixed(1) + ' km');
  }
  L2.push('', 'Street, Completed');
  [...doneSet].sort(byTime(doneTimes)).forEach(n => L2.push(n + ', ' + (doneTimes[n] ? fmtStamp(doneTimes[n]) : '(no time)') + (doneVia[n] === 'gps' ? ' (GPS-verified)' : '')));
  const todo = names.filter(n => !doneSet.has(n));
  if (todo.length) L2.push('', 'Not done: ' + todo.join(', '));
  const fl = names.filter(n => notes[n] && notes[n].length);
  if (fl.length) { L2.push('', 'Flags:'); fl.forEach(n => L2.push(n + ' \u2014 ' + flagText(n))); }
  history.slice().reverse().forEach(h => {
    const items = h.items || {}, ks = Object.keys(items).sort(byTime(items));
    L2.push('', 'Archived run (reset ' + fmtStamp(h.at) + ', ' + ks.length + ' streets' + (h.startedAt ? ', started ' + fmtStamp(h.startedAt) : '') + (h.km ? ', ' + h.km + ' km' : '') + ')');
    ks.forEach(n => L2.push(n + ', ' + (items[n] ? fmtStamp(items[n]) : '(no time)') + ((h.via || {})[n] === 'gps' ? ' (GPS-verified)' : '')));
  });

}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

    doneSet = new Set(Object.keys(snap.items));
    doneTimes = {};

    doneVia = Object.assign({}, snap.via || {});

// ===== GPS FOLLOW =====
let follow = false, watchId = null, gpsDrawn = false, lastAcc = 20, wakeLock = null;

const gpsBtn = $('gpsBtn');
function gpsBtnState() {
  gpsBtn.classList.toggle('on', follow);
  gpsBtn.classList.toggle('paused', !follow && watchId !== null);
}
async function setWake(on) {
  try {
    if (on) {
      if (navigator.wakeLock && !wakeLock) {
        const wl = await navigator.wakeLock.request('screen');
        if (!follow) { try { await wl.release(); } catch (e) {} return; }   // follow ended while we waited
        wakeLock = wl;
        wl.addEventListener('release', () => { if (wakeLock === wl) wakeLock = null; });
      }
    } else if (wakeLock) {
      const wl = wakeLock; wakeLock = null; await wl.release();
    }
  } catch (e) {}
}
function pauseFollow() {

}

  const first = !gpsDrawn;
  const acc = Math.max(c.accuracy || 20, 15);
  gpsDrawn = true; lastAcc = acc; drawGps();
  if (c.speed != null && isFinite(c.speed)) { $('spd').textContent = Math.round(c.speed * 3.6) + ' km/h'; $('spd').classList.remove('hidden'); }
  recordTrail(c.latitude, c.longitude, c.accuracy || 0, Math.round(lastFixAt / 1000));
  coverFix(c.latitude, c.longitude, c.accuracy || 0);
  const inside = allowedBounds.contains(lastPos);
  if (inside) outsideWarned = false;
  if (follow) {
    if (inside) { if (first) map.jumpTo({ center: toLL(lastPos), zoom: Math.max(map.getZoom(), 16) }); else map.easeTo({ center: toLL(lastPos) }); }
    else if (!outsideWarned) { outsideWarned = true; showToast('You are outside the route area'); }
  }
}
function onGpsError(err) {
  if (err && err.code === 1) {   // permission denied: nothing to retry
    showToast('Location is blocked for this page \u2014 allow it in iOS Settings, then tap the pin again');
    stopWatch();
    return;
  }
  // signal lost / timeout: transient (overpass, tunnel, tall buildings) — keep the watch alive
  const now = Date.now();
  if (now - lastGpsToast > 15000) { lastGpsToast = now; showToast('GPS signal weak \u2014 still trying'); }
}
function startWatch() {
  lastFixAt = Date.now();
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError, { enableHighAccuracy: true, maximumAge: 2000 });
}
function restartWatch() {
  if (watchId === null) return;
  try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
  startWatch();
}
function stopWatch() {
  if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} }
  watchId = null; follow = false; outsideWarned = false;
  gpsDrawn = false; drawGps();
  $('spd').classList.add('hidden');
  setWake(false); gpsBtnState();
}
let lastGpsTap = 0;
gpsBtn.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastGpsTap < 400) return;
  lastGpsTap = now;
  if (!navigator.geolocation) { showToast('GPS not available on this device'); return; }
  if (watchId === null) {           // off -> start watching + follow
    follow = true; startWatch(); setWake(true); gpsBtnState();
    if (lastPos && allowedBounds.contains(lastPos)) map.jumpTo({ center: toLL(lastPos), zoom: Math.max(map.getZoom(), 16) });
  } else if (!follow) {             // paused -> resume follow
    follow = true; setWake(true); gpsBtnState();
    if (lastPos && allowedBounds.contains(lastPos)) map.easeTo({ center: toLL(lastPos) });
  } else {                          // following -> off
    stopWatch();
  }
});
map.on('dragstart', pauseFollow);
// iOS releases the wake-lock whenever the page is backgrounded (call, app switch) and can quietly stall
// a watch. Coming back to the page re-takes the lock and restarts the watch; a watchdog also restarts a
// watch that has produced no fix for 45 s.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (follow) setWake(true);
  restartWatch();
});
setInterval(() => { if (watchId !== null && Date.now() - lastFixAt > 45000) restartWatch(); }, 10000);

// ===== OFFLINE MAP (manual toggle, persisted) + automatic switch when the signal drops =====
let offlineOn = false, autoOffline = false;
try { offlineOn = localStorage.getItem(LS_OFFLINE_KEY) === '1'; } catch (e) {}
const offBtn = $('offBtn');
function applyOffline() {
  applyBasemap();
  offBtn.classList.toggle('on', offlineOn);
  offBtn.textContent = offlineOn ? (autoOffline ? 'Offline map: AUTO' : 'Offline map: ON') : 'Offline map';
}
let lastOffTap = 0;
offBtn.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastOffTap < 400) return;
  lastOffTap = now;
  autoOffline = false;
  offlineOn = !offlineOn;
  applyOffline();
  lsSet(LS_OFFLINE_KEY, offlineOn ? '1' : '0');
  showToast(offlineOn ? 'Offline map on' : 'Live map on');
});
function goAutoOffline() {
  if (offlineOn) return;
  offlineOn = true; autoOffline = true; applyOffline();   // not persisted: it is a temporary reaction to no signal
  showToast('No signal \u2014 offline map on');
}
window.addEventListener('offline', goAutoOffline);
window.addEventListener('online', () => {
  if (!autoOffline) return;
  autoOffline = false; offlineOn = false; applyOffline();
  showToast('Back online \u2014 live map');
});

// ===== NIGHT MODE (plowing happens in the dark): dims the live tiles, restyles the offline roads =====
let nightOn = false;
try {
  const v = localStorage.getItem(LS_NIGHT_KEY);
  nightOn = v === null ? !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) : v === '1';
} catch (e) {}
const nightBtn = $('nightBtn');
function applyNight() {
  document.body.classList.toggle('night', nightOn);
  if (mapReady) {
    try {
      map.setPaintProperty('offnet-line', 'line-color', offColorExpr(nightOn));
      map.setPaintProperty('offlabels', 'text-color', nightOn ? '#9aa4b2' : '#5f6871');
      map.setPaintProperty('offlabels', 'text-halo-color', nightOn ? '#14171d' : 'rgba(255,255,255,.8)');
    } catch (e) {}
    restyleBasemap();
  }
  nightBtn.classList.toggle('on', nightOn);
  nightBtn.textContent = nightOn ? 'Night: ON' : 'Night';
}
let lastNightTap = 0;
nightBtn.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastNightTap < 400) return;
  lastNightTap = now;
  nightOn = !nightOn;
  applyNight();
  lsSet(LS_NIGHT_KEY, nightOn ? '1' : '0');
});

// ===== SATELLITE (Esri World Imagery raster under the route lines) =====
const satBtn = $('satBtn');
let lastSatTap = 0;
satBtn.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastSatTap < 400) return;
  lastSatTap = now;
  satOn = !satOn;
  satBtn.classList.toggle('on', satOn);
  applyBasemap();
  showToast(satOn ? 'Satellite on' : 'Satellite off');
});

// ===== BREADCRUMB TRAIL (fleet-tracker style route history; stored on-device, exportable as GPX) =====
const TRAIL_MAX = 8000;
let auxDirty = false;
function recordTrail(lat, lng, acc, tSec) {
  if (acc > 50) return;
  const last = trail[trail.length - 1];
  if (last && dist(last, [lat, lng]) < 8 && tSec - last[2] < 30) return;   // moved <8 m and <30 s: skip
  const pt = [+lat.toFixed(5), +lng.toFixed(5), tSec];
  trail.push(pt);
  if (trail.length > TRAIL_MAX + 500) { trail.splice(0, trail.length - TRAIL_MAX); drawTrail(); }
  else drawTrail();
  auxDirty = true;
}
function trailKm(sinceMs) {
  let d = 0;
  for (let i = 1; i < trail.length; i++) {
    if (trail[i][2] * 1000 < sinceMs || trail[i][2] - trail[i - 1][2] > 300) continue;   // ignore gaps where tracking was off
    d += dist(trail[i - 1], trail[i]);
  }
  return d / 1000;
}
function flushAux() { if (auxDirty) { saveTrail(); saveCov(); auxDirty = false; } }
setInterval(flushAux, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAux(); });
window.addEventListener('pagehide', flushAux);

// ===== GPS COVERAGE SUGGESTION (planned-route vs live-GPS comparison, as city plow trackers do) =====
// Each street is sampled every ~15 m. Driving within 22 m of a sample (with a decent fix) counts it as covered;
// at 85% coverage the app OFFERS to mark the street done (one tap) and stamps the time coverage was reached.
// It never marks automatically: deadheading and plow-up passes look identical to plowing on GPS.
const SAMPLE_M = 15, COV_R = 22, COV_FRAC = 0.85;
(function buildSamples() {
  names.forEach(n => {
    const out = [];
    streets[n].segs.forEach(seg => {
      for (let i = 0; i < seg.length - 1; i++) {
        const a = seg[i], b = seg[i + 1];
        const len = Math.hypot((b[1] - a[1]) * MLNG, (b[0] - a[0]) * MLAT), k = Math.max(1, Math.ceil(len / SAMPLE_M));
        for (let j = (i === 0 ? 0 : 1); j <= k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
      }
    });
    streets[n].samples = out;
    streets[n].pb = streets[n].bounds.pad(0.15);
  });
})();
const dismissed = new Set(), sugAt = {};
let suggestQueue = [], suggestShown = null;
function showSuggest() {
  if (suggestShown) return;
  while (suggestQueue.length) {
    const n = suggestQueue.shift();
    if (doneSet.has(n) || dismissed.has(n)) continue;
    suggestShown = n;
    $('sugText').textContent = n + ' looks covered';
    $('suggest').classList.remove('hidden');
    return;
  }
  $('suggest').classList.add('hidden');
}
function coverFix(lat, lng, acc) {
  if (acc > 35) return;
  const pt = [lat, lng];
  names.forEach(n => {
    if (doneSet.has(n) || dismissed.has(n)) return;
    const s = streets[n];
    if (!s.pb.contains(pt)) return;
    const set = covSet[n] || (covSet[n] = new Set());
    let added = false;
    s.samples.forEach((sm, i) => {
      if (!set.has(i)) { const dx = (lng - sm[1]) * MLNG, dy = (lat - sm[0]) * MLAT; if (dx * dx + dy * dy < COV_R * COV_R) { set.add(i); added = true; } }
    });
    if (added) auxDirty = true;
    if (set.size / s.samples.length >= COV_FRAC) {
      if (!sugAt[n]) sugAt[n] = new Date().toISOString();
      if (!suggestQueue.includes(n) && suggestShown !== n) { suggestQueue.push(n); showSuggest(); }
    }
  });
}
$('sugYes').addEventListener('click', () => {
  const n = suggestShown; if (!n) return;
  suggestShown = null;
  if (!doneSet.has(n)) markDone(n, 'gps', sugAt[n]);
  showSuggest();
});
$('sugNo').addEventListener('click', () => {
  if (suggestShown) dismissed.add(suggestShown);
  suggestShown = null; showSuggest();
});

// ===== STREET FLAGS (issue reporting, glove-friendly: one tap, time-stamped) =====
let lastFlagTap = 0;
document.querySelectorAll('#flagChips button').forEach(b => {
  b.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastFlagTap < 300 || !selected) return;
    lastFlagTap = now;
    const list = notes[selected] || [], i = list.findIndex(f => f.k === b.dataset.k);
    if (i >= 0) list.splice(i, 1); else list.push({ k: b.dataset.k, at: new Date().toISOString() });
    if (list.length) notes[selected] = list; else delete notes[selected];
    saveAux(); renderPanel(); renderList();
  });
});

// ===== NAVIGATE TO THE START OF THE SELECTED STREET (hands off to Apple/Google Maps turn-by-turn) =====
let lastNavTap = 0;
$('navBtn').addEventListener('click', () => {
  const now = Date.now();
  if (now - lastNavTap < 600 || !selected) return;
  lastNavTap = now;
  const c = map.getCenter();
  const ref = (watchId !== null && lastPos) ? lastPos : [c.lat, c.lng];
  let best = null, bd = Infinity;
  streets[selected].segs.forEach(seg => [seg[0], seg[seg.length - 1]].forEach(p => { const d = dist(ref, p); if (d < bd) { bd = d; best = p; } }));
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const url = ios ? 'https://maps.apple.com/?dirflg=d&daddr=' + best[0] + ',' + best[1]
                  : 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + best[0] + ',' + best[1];
  try { window.open(url, '_blank'); } catch (e) { showToast('Could not open Maps'); }
});

// ===== RUN STATS: start time, elapsed, ETA from your own pace, finish time, GPS distance =====
function updateStats() {
  const el = $('stats');
  const ts = [...doneSet].map(n => Date.parse(doneTimes[n])).filter(t => !isNaN(t)).sort((a, b) => a - b);
  if (!ts.length) { el.classList.add('hidden'); return; }
  const first = ts[0], last = ts[ts.length - 1];
  let txt = 'Started ' + fmtClock(new Date(first));
  if (doneSet.size >= TOTAL) txt += ' \u00b7 finished ' + fmtClock(new Date(last)) + ' \u00b7 ' + fmtDur(last - first);
  else {
    txt += ' \u00b7 ' + fmtDur(Date.now() - first);
    if (ts.length >= 3) txt += ' \u00b7 ETA ' + fmtClock(new Date(Date.now() + (TOTAL - doneSet.size) * (last - first) / (ts.length - 1)));
  }
  const km = trail.length > 1 ? trailKm(first) : 0;
  if (km >= 0.1) txt += ' \u00b7 ' + km.toFixed(1) + ' km';
  el.textContent = txt;
  el.classList.remove('hidden');
}
setInterval(() => { updateStats(); if (selected) renderPanel(); if ($('sheet').classList.contains('open')) renderList(); }, 60000);

// ===== HOME-SCREEN ICON + SERVICE WORKER (optional: needs sw.js hosted beside this page, over https) =====
(function () {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#14161c'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#ffd24a'; x.fillRect(24, 128, 132, 10);
    x.fillStyle = '#ffffff'; x.font = 'bold 84px -apple-system, Helvetica, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('5W', 90, 74);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch (e) {}
})();
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
} catch (e) {}

// ===== INIT =====
refreshAll(); applyNight(); applyOffline();
if (navigator.onLine === false) goAutoOffline();
</script>
